name: swift-development

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000/api/v1}"
      VITE_APP_NAME: "${VITE_APP_NAME:-Swift}"
      VITE_DEFAULT_THEME: "${VITE_DEFAULT_THEME:-dark}"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: "no"
    networks:
      - swift

volumes:
  frontend_node_modules:

networks:
  swift:
    name: swift-development
