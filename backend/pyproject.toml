[project]
name = "swift-support-backend"
version = "0.1.0"
description = "Swift multilingual support-ticket API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "email-validator>=2.2,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  # >=5 is required, not a preference: logfire 3.x pins
  # opentelemetry-instrumentation-fastapi 0.56b0, whose route resolver crashes on
  # FastAPI >=0.141 (_IncludedRouter has no .path). That combination 500s every request.
  "logfire[fastapi,httpx]>=5,<6",
  "pgvector>=0.3,<1",
  "redis>=5,<6",
  "dramatiq[redis]>=1.17,<2",
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
  # >=12.3 clears 25 advisories (PYSEC-2026-2249..3496) in the image decoders that
  # parse customer-uploaded attachments in the OCR path.
  "Pillow>=12.3,<13",
  "pytesseract>=0.3.10,<1",
]

[project.scripts]
swift-ingest-kb = "app.rag.ingest:main"
swift-eval-rag = "app.rag.eval_runner:main"

[project.optional-dependencies]
rag = [
  "flashrank>=0.2,<1",
]
rag-local = [
  "FlagEmbedding>=1.3,<2",
  "flashrank>=0.2,<1",
]
dev = [
  "httpx>=0.28,<1",
  # schemathesis 4.x requires pytest>=9, which in turn needs pytest-asyncio>=1.0.
  "pytest>=9,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6,<8",
  "pytest-timeout>=2.3,<3",
  "pytest-json-report>=1.5,<2",
  "pytest-subtests>=0.13,<1",
  "hypothesis>=6.100,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

# Security and contract tooling. Split from `dev` because these are slower and are
# meant to run as their own CI gates rather than on every local pytest invocation.
security = [
  "bandit[toml]>=1.8,<2",
  "pip-audit>=2.7,<3",
  "schemathesis>=4,<5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung external call should fail the run, not stall CI forever.
timeout = 120
markers = [
  "security: adversarial and access-control tests",
  "database: schema, constraint and transaction integrity tests",
  "contract: OpenAPI contract conformance",
  "observability: tracing, logging and PII-hygiene tests",
  "slow: excluded from the fast pre-commit run",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/workers/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "alembic"]

[tool.logfire]
# Tests exercise the service without booting main.py, where configure() is called.
ignore_no_config = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
# 3.12 matches the interpreter this is actually checked with. NOTE: backend/Dockerfile
# ships python:3.11-slim, so type checking and production run different minor versions --
# align one of them.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Neither ships type stubs; both are used behind narrow, hand-typed wrappers.
module = ["pytesseract.*", "joblib.*", "flashrank.*", "FlagEmbedding.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
