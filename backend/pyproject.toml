[project]
name = "swift-support-backend"
version = "0.1.0"
description = "Swift multilingual support-ticket API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "email-validator>=2.2,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.3,<1",
  "redis>=5,<6",
  "dramatiq[redis]>=1.17,<2",
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
  "Pillow>=10.0,<12",
  "pytesseract>=0.3.10,<1",
]

[project.scripts]
swift-ingest-kb = "app.rag.ingest:main"

[project.optional-dependencies]
rag = [
  "flashrank>=0.2,<1",
]
rag-local = [
  "FlagEmbedding>=1.3,<2",
  "flashrank>=0.2,<1",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
