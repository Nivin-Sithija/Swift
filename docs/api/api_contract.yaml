          format: uuid
        customer_id:
          type: string
          format: uuid
        assigned_agent_id:
          type: string
          format: uuid
          nullable: true
        queue_id:
          type: string
          format: uuid
          nullable: true
        final_category_id:
          type: integer
          nullable: true
        original_text:
          type: string
        normalised_text:
          type: string
          nullable: true
        masked_model_text:
          type: string
          nullable: true
        detected_language_form:
          $ref: '#/components/schemas/LanguageForm'
        requested_response_language:
          allOf:
          - $ref: '#/components/schemas/InterfaceLanguage'
          nullable: true
        final_priority:
          allOf:
          - $ref: '#/components/schemas/TicketPriority'
          nullable: true
        final_sentiment:
          allOf:
          - $ref: '#/components/schemas/SentimentLabel'
          nullable: true
        status:
          $ref: '#/components/schemas/TicketStatus'
        manual_review_required:
          type: boolean
        escalation_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
    TicketEvent:
      type: object
