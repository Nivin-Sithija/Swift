openapi: 3.0.3
info:
  title: Swift Trilingual Ticket Management API
  version: 1.0.0
  description: >-
    REST contract for the implemented ticket-management backend. RAG, vector
    retrieval, LLM generation, banking-core access, and external notifications
    are intentionally outside this release. The running FastAPI application at
    /openapi.json is the executable schema for detailed request/response models.
servers:
  - url: http://localhost:8000/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get: {security: [], summary: Liveness check, responses: {'200': {description: Healthy}}}
  /ready:
    get: {security: [], summary: Database readiness check, responses: {'200': {description: Ready}}}
  /auth/login:
    post: {security: [], summary: Authenticate and create a refresh session, responses: {'200': {description: Authenticated}, '401': {description: Invalid credentials}}}
  /auth/refresh:
    post: {security: [], summary: Rotate the HttpOnly refresh session, responses: {'200': {description: Rotated}, '401': {description: Invalid session}}}
  /auth/logout:
    post: {summary: Revoke the current refresh session, responses: {'204': {description: Revoked}}}
  /users/me:
    get: {summary: Current authenticated user, responses: {'200': {description: User}}}
  /tickets:
    get: {summary: Role-scoped paginated ticket list, responses: {'200': {description: Tickets}}}
    post: {summary: Create and process a customer ticket, responses: {'201': {description: Ticket created}}}
  /tickets/{ticket_id}:
    get:
      summary: Role-scoped ticket details
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses: {'200': {description: Ticket}, '404': {description: Not found or inaccessible}}
  /tickets/{ticket_id}/notes:
    post:
      summary: Add an internal staff note
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses: {'201': {description: Note created}, '403': {description: Staff access required}}
  /tickets/{ticket_id}/status:
    put:
      summary: Apply a validated ticket-status transition
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses: {'200': {description: Updated}, '409': {description: Invalid transition or stale version}}
  /tickets/{ticket_id}/assignment:
    put:
      summary: Assign a ticket to an active staff member
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses: {'200': {description: Assigned}}
  /tickets/{ticket_id}/escalate:
    post:
      summary: Escalate with an auditable reason
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses: {'200': {description: Escalated}}
  /tickets/{ticket_id}/attachments:
    post:
      summary: Upload a validated PNG, JPEG, or PDF attachment
      parameters: [{$ref: '#/components/parameters/TicketId'}]
      responses: {'201': {description: Stored}, '413': {description: Too large}, '415': {description: Unsupported or mismatched type}}
  /attachments/{attachment_id}/download:
    get:
      summary: Authorized attachment download
      parameters: [{$ref: '#/components/parameters/AttachmentId'}]
      responses: {'200': {description: Attachment}, '404': {description: Not found or inaccessible}}
  /predictions/{prediction_id}/reviews:
    put:
      summary: Review or correct a preserved prediction
      parameters: [{$ref: '#/components/parameters/PredictionId'}]
      responses: {'200': {description: Reviewed}}
  /responses/{response_id}:
    patch:
      summary: Edit an unapproved deterministic template draft
      parameters: [{$ref: '#/components/parameters/ResponseId'}]
      responses: {'200': {description: Edited}, '409': {description: Response is immutable}}
  /responses/{response_id}/approve:
    post:
      summary: Approve a reviewed response
      parameters: [{$ref: '#/components/parameters/ResponseId'}]
      responses: {'200': {description: Approved}}
  /responses/{response_id}/reject:
    post:
      summary: Reject an unsent response
      parameters: [{$ref: '#/components/parameters/ResponseId'}]
      responses: {'200': {description: Rejected}}
  /responses/{response_id}/send:
    post:
      summary: Make an approved response customer-visible
      parameters: [{$ref: '#/components/parameters/ResponseId'}]
      responses: {'200': {description: Sent}, '409': {description: Approval required}}
  /dashboard/metrics:
    get: {summary: Staff dashboard metrics, responses: {'200': {description: Metrics}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    TicketId: {name: ticket_id, in: path, required: true, schema: {type: string}, description: Public ticket ID}
    AttachmentId: {name: attachment_id, in: path, required: true, schema: {type: string, format: uuid}}
    PredictionId: {name: prediction_id, in: path, required: true, schema: {type: string, format: uuid}}
    ResponseId: {name: response_id, in: path, required: true, schema: {type: string, format: uuid}}
