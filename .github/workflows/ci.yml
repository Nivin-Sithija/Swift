name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, lint, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile. If that image moves, move this with it.
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,rag]'
      - name: Lint
        run: ruff check app tests
      - name: Types
        run: mypy app
      - name: Tests
        # Runs without Postgres or Redis: the suite uses in-memory SQLite and stubs
        # every external call. Keep it that way — a suite that needs services does
        # not get run.
        run: pytest -q --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  security:
    name: Backend security scans
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,rag,security]'
      - name: Static analysis
        run: bandit -q -r app -ll
      - name: Dependency advisories
        run: pip-audit
      - name: Security and contract suites
        run: pytest -q -m "security or contract or database or observability"

  frontend:
    name: Frontend (tests, lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx vitest run --coverage
      - run: npm run build
      - name: Dependency advisories
        run: npm audit --audit-level=high
